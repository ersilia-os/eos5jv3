Title: MycoPermeNet mycobacterial membrane permeation
Description: Predicts how readily a small molecule crosses the mycomembrane, the waxy
  barrier that keeps drugs out of Mycobacterium tuberculosis. Lepori and colleagues
  profiled 1,572 azide-tagged compounds with the click-chemistry PAC-MAN assay, then
  confirmed the chemical correlates by synthesising and testing three new molecule
  series. Ersilia serves MycoPermeNet-v2, which fuses a directed message-passing graph
  encoder with normalised RDKit descriptors in a multilayer perceptron trained by
  Fusion Noisy Student self-distillation. Training compounds were small, so larger
  molecules are out of domain.
