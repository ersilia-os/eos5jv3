Title: MycoPermeNet mycobacterial membrane permeation
Description: 'Predicts passage through the mycobacterial outer membrane, the waxy barrier that makes Mycobacterium tuberculosis unusually impermeable and narrows the chemistry available for tuberculosis drug discovery. Machine learning was applied to accumulation measurements to identify the features favouring permeation. The output is a standardised residual rather than a raw rate, and it runs in the opposite direction to intuition: lower values indicate a compound that permeates more readily.'
