Status: Ready
Title: MycoPermeNet
Description: Predicts the permeation of small molecules across the mycomembrane
  (outer membrane) of *Mycobacterium tuberculosis* from a SMILES string. This
  MycoPermeNet-v2 model fuses a graph neural network embedding with normalized
  RDKit descriptors and a multilayer perceptron, trained with a Fusion Noisy
  Student Self-Distillation strategy. Lower scores indicate higher permeability.
  Applicability domain -- trained on small azide-tagged compounds (MW ~82-570, up
  to ~50 heavy atoms); predictions for larger, out-of-domain molecules may fall
  outside the -3.1 to +1.6 output range and be unreliable.
